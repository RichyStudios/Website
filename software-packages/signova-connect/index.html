<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Signova Connect</title>
<style>
body{margin:0;background:#eef5ff;color:#12213d;font:16px system-ui}main{max-width:760px;margin:40px auto;padding:32px;background:#fff;border-radius:24px;box-shadow:0 20px 60px #183a7020}h1{font-size:42px;margin:0 0 8px}p{color:#5d6b82;line-height:1.6}label{display:grid;gap:7px;margin:18px 0;font-weight:700}input,textarea,select{font:inherit;padding:13px;border:1px solid #bdcbe0;border-radius:10px}textarea{min-height:120px}button{padding:14px 20px;border:0;border-radius:10px;background:#2458d8;color:#fff;font-weight:800}pre{white-space:pre-wrap;padding:20px;background:#0b234e;color:#c9f9eb;border-radius:14px}a{color:#2458d8}
</style>
<main><small>SIGNOVA TECHNOLOGY</small><h1>Signova Connect</h1><p>Prepare a clear computer support summary. Your information stays in this browser page until you copy it.</p>
<label>Your device<input id="device" placeholder="Example: Windows laptop"></label><label>Communication preference<select id="access"><option>ASL video</option><option>Text message</option><option>Email</option><option>Phone call</option></select></label><label>What is happening?<textarea id="issue" placeholder="Describe the problem and any error message"></textarea></label><button id="make">Create support summary</button><pre id="output" aria-live="polite">Your summary will appear here.</pre><p><a href="https://noble-new-studio.richynoble90.chatgpt.site/support">Open Signova online support</a></p></main>
<script>document.querySelector('#make').onclick=()=>{const d=document.querySelector('#device').value||'Not provided',a=document.querySelector('#access').value,i=document.querySelector('#issue').value||'Not provided';document.querySelector('#output').textContent=`Device: ${d}\nCommunication: ${a}\nProblem: ${i}`}</script>
</html>
